spring.application.name=movietheater
server.port=8078

# ====================== DATABASE ======================
spring.datasource.url=jdbc:mysql://localhost:3306/movie_theater?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ====================== THYMELEAF ======================
spring.thymeleaf.cache=false

# ====================== LOGGING ======================
logging.level.com.example.movietheater=DEBUG
logging.level.org.springframework.web=DEBUG
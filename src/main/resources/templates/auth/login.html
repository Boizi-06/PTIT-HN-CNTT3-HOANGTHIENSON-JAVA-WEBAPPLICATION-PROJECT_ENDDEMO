<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Boizi Cinema</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            overflow: hidden;

            /* 🎬 BACKGROUND POSTER */
            background: url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1600&q=80') no-repeat center center/cover;
            position: relative;
        }

        /* DARK OVERLAY */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.70);
            backdrop-filter: blur(3px);
        }

        /* FLOAT LIGHT EFFECT */
        body::after {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(79,172,254,0.25), transparent 60%);
            top: -120px;
            right: -120px;
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(40px); }
        }

        .login-wrapper {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* GLASS CARD */
        .login-card {
            width: 100%;
            max-width: 450px;

            border-radius: 20px;
            overflow: hidden;

            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.15);

            box-shadow: 0 20px 60px rgba(0,0,0,0.6);

            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            padding: 25px;
            color: white;
            background: linear-gradient(135deg, rgba(79,172,254,0.9), rgba(0,242,254,0.9));
        }

        .login-header h4 {
            font-weight: 600;
            letter-spacing: 1px;
        }

        .card-body {
            padding: 30px;
        }

        label {
            color: #fff;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 12px;
            padding: 12px;
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: #4facfe;
            box-shadow: 0 0 12px rgba(79,172,254,0.4);
            color: #fff;
        }

        .btn-login {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            color: white;
            transition: 0.3s;
        }

        .btn-login:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(79,172,254,0.4);
        }

        .error-message {
            background: rgba(255, 77, 79, 0.15);
            color: #ff6b6b;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 77, 79, 0.3);
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            color: #fff;
            font-size: 14px;
        }

        .footer-link a {
            color: #4facfe;
            font-weight: 600;
            text-decoration: none;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="login-header">
            <h4>🎬 Boizi Cinema</h4>
            <p class="mb-0">Chào mừng bạn quay lại</p>
        </div>

        <div class="card-body">

            <div th:if="${param.error}" class="error-message">
                Sai tên đăng nhập hoặc mật khẩu!
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Nhập username">
                </div>

                <div class="mb-3">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu">
                </div>

                <button type="submit" class="btn btn-login w-100">
                    Đăng Nhập
                </button>

            </form>

            <div class="footer-link">
                Chưa có tài khoản?
                <a th:href="@{/register}">Đăng ký ngay</a>
            </div>

        </div>
    </div>

</div>

</body>
</html>

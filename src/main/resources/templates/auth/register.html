<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - Smart Cinema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .register-header {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            padding: 25px;
            text-align: center;
            color: white;
        }

        .register-header h4 {
            margin: 0;
            font-weight: 600;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .form-control:focus {
            border-color: #00c6ff;
            box-shadow: 0 0 0 0.2rem rgba(0,198,255,0.25);
        }

        .btn-success {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .card-body {
            padding: 30px;
        }

        .footer-link a {
            text-decoration: none;
            color: #00c6ff;
            font-weight: 500;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        .form-label {
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card register-card">

                <div class="register-header">
                    <h4>🎬 Smart Cinema</h4>
                    <p class="mb-0">Tạo tài khoản để bắt đầu</p>
                </div>

                <div class="card-body">
                    <form th:action="@{/register}" method="post" th:object="${registerRequest}">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" th:field="*{username}" class="form-control" placeholder="Nhập username" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" th:field="*{email}" class="form-control" placeholder="Nhập email" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mật khẩu</label>
                            <input type="password" th:field="*{password}" class="form-control" placeholder="Nhập mật khẩu" required>
                        </div>

                        <!-- ==================== THÊM XÁC NHẬN MẬT KHẨU ==================== -->
                        <div class="mb-3">
                            <label class="form-label">Xác nhận mật khẩu</label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Nhập lại mật khẩu" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Họ tên</label>
                                <input type="text" th:field="*{fullName}" class="form-control" placeholder="Nguyễn Văn A">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Số điện thoại</label>
                                <input type="text" th:field="*{phone}" class="form-control" placeholder="0123456789">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Đăng Ký</button>
                    </form>

                    <div class="text-center mt-4 footer-link">
                        <p>Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
                    </div>

                </div>

            </div>
        </div>
    </div>
</div>

</body>
</html>

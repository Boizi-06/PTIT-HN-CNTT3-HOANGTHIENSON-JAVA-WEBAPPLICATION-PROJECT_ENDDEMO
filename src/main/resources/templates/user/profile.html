<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Hồ sơ cá nhân - BOIZI Cinema</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: 'Poppins', sans-serif;
            background:
                    linear-gradient(rgba(5,10,20,0.96), rgba(5,10,20,0.98)),
                    url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1974')
                    center/cover fixed;
            color: white;
            min-height: 100vh;
        }

        /* NAVBAR */

        .navbar{
            background: rgba(10,10,15,0.88);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 14px 0;
        }

        .navbar-brand{
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .nav-link{
            color: rgba(255,255,255,0.75) !important;
            margin: 0 10px;
            transition: 0.3s;
            position: relative;
        }

        .nav-link:hover{
            color: white !important;
        }

        .nav-link::after{
            content: '';
            width: 0;
            height: 2px;
            background: #e50914;
            position: absolute;
            bottom: -5px;
            left: 0;
            transition: 0.3s;
        }

        .nav-link:hover::after{
            width: 100%;
        }

        /* PROFILE */

        .profile-wrapper{
            padding-top: 120px;
            padding-bottom: 60px;
        }

        .profile-card{
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.45);
        }

        .profile-header{
            background:
                    linear-gradient(135deg,#e50914,#ff4d4d);
            padding: 40px;
            text-align: center;
            position: relative;
        }

        .profile-avatar{
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            border: 4px solid rgba(255,255,255,0.2);
            font-size: 3rem;
        }

        .member-badge{
            background: linear-gradient(90deg,#f59e0b,#fbbf24);
            color: black;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 999px;
            display: inline-block;
            margin-top: 12px;
        }

        .profile-body{
            padding: 40px;
        }

        .section-title{
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 25px;
        }

        /* FORM */

        .form-label{
            color: rgba(255,255,255,0.8);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-control{
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 14px 16px;
            color: white;
            transition: 0.3s;
        }

        .form-control:focus{
            background: rgba(255,255,255,0.08);
            border-color: #e50914;
            box-shadow: 0 0 0 0.25rem rgba(229,9,20,0.2);
            color: white;
        }

        .form-control::placeholder{
            color: rgba(255,255,255,0.4);
        }

        /* BUTTON */

        .btn-save{
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(90deg,#e50914,#ff4d4d);
            font-weight: 600;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(229,9,20,0.3);
        }

        .btn-save:hover{
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(229,9,20,0.45);
        }

        /* ALERT */

        .alert{
            border-radius: 14px;
            border: none;
        }

        /* DROPDOWN */

        .profile-btn{
            background: rgba(255,255,255,0.05);
            border-radius: 50px;
            padding: 8px 18px;
        }

        .dropdown-menu{
            background: #111827;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
        }

        .dropdown-item{
            color: white;
            padding: 12px 16px;
        }

        .dropdown-item:hover{
            background: rgba(255,255,255,0.08);
            color: white;
        }

        hr{
            border-color: rgba(255,255,255,0.08);
        }

    </style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">

    <div class="container">

        <a class="navbar-brand" href="/">
            <i class="fas fa-film text-danger me-2"></i>
            SMART CINEMA
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/movies">Phim</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/showtimes">Suất chiếu</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/promotions">Khuyến mãi</a>
                </li>

            </ul>

            <!-- USER -->

            <div class="d-flex align-items-center"
                 sec:authorize="isAuthenticated()">

                <div class="dropdown">

                    <button class="btn text-white border-0 profile-btn d-flex align-items-center gap-3"
                            type="button"
                            data-bs-toggle="dropdown">

                        <i class="fas fa-user-circle fa-2x text-secondary"></i>

                        <div class="text-start">

                            <div class="fw-medium"
                                 th:text="${@userHelper.getFullName(#authentication)}">
                            </div>

                            <span class="member-badge">
                                MEMBER
                            </span>

                        </div>

                    </button>

                    <ul class="dropdown-menu dropdown-menu-end">

                        <li>
                            <a class="dropdown-item"
                               th:href="@{/profile}">

                                <i class="fas fa-user me-2"></i>
                                Hồ sơ cá nhân

                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item"
                               th:href="@{/member-card}">

                                <i class="fas fa-id-card me-2"></i>
                                Thẻ thành viên

                            </a>
                        </li>

                        <li>
                            <hr class="dropdown-divider border-secondary">
                        </li>

                        <li>
                            <form th:action="@{/logout}" method="post">

                                <button type="submit"
                                        class="dropdown-item text-danger">

                                    <i class="fas fa-sign-out-alt me-2"></i>
                                    Đăng xuất

                                </button>

                            </form>
                        </li>

                    </ul>

                </div>

            </div>

        </div>

    </div>

</nav>

<!-- PROFILE -->

<div class="container profile-wrapper">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="profile-card">

                <!-- HEADER -->

                <div class="profile-header">

                    <div class="profile-avatar">

                        <i class="fas fa-user"></i>

                    </div>

                    <h3 class="mt-3 fw-bold"
                        th:text="${ #authentication.principal.fullName ?: #authentication.name ?: 'Người dùng' }">
                    </h3>

                    <span class="member-badge">
                        PREMIUM MEMBER
                    </span>

                </div>

                <!-- BODY -->

                <div class="profile-body">

                    <div th:if="${success}"
                         class="alert alert-success"
                         th:text="${success}">
                    </div>

                    <div th:if="${error}"
                         class="alert alert-danger"
                         th:text="${error}">
                    </div>

                    <form th:action="@{/profile}"
                          method="post"
                          th:object="${profileRequest}">

                        <!-- INFO -->

                        <h5 class="section-title">
                            👤 Thông tin cá nhân
                        </h5>

                        <div class="row">

                            <div class="col-md-6 mb-4">

                                <label class="form-label">
                                    Tên đăng nhập
                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:field="*{username}"
                                       placeholder="Nhập username">

                            </div>

                            <div class="col-md-6 mb-4">

                                <label class="form-label">
                                    Họ và tên
                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:field="*{fullName}"
                                       placeholder="Nhập họ tên">

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-4">

                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                       class="form-control"
                                       th:field="*{email}"
                                       placeholder="Nhập email">

                            </div>

                            <div class="col-md-6 mb-4">

                                <label class="form-label">
                                    Số điện thoại
                                </label>

                                <input type="tel"
                                       class="form-control"
                                       th:field="*{phone}"
                                       placeholder="Nhập số điện thoại">

                            </div>

                        </div>

                        <hr class="my-4">

                        <!-- PASSWORD -->

                        <h5 class="section-title text-warning">
                            🔒 Đổi mật khẩu
                        </h5>

                        <div class="mb-4">

                            <label class="form-label">
                                Mật khẩu hiện tại
                            </label>

                            <input type="password"
                                   class="form-control"
                                   th:field="*{currentPassword}"
                                   placeholder="Nhập mật khẩu hiện tại">

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Mật khẩu mới
                            </label>

                            <input type="password"
                                   class="form-control"
                                   th:field="*{newPassword}"
                                   placeholder="Nhập mật khẩu mới">

                        </div>

                        <button type="submit"
                                class="btn btn-save text-white">

                            <i class="fas fa-save me-2"></i>
                            Cập nhật thông tin

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="vi">

<head>

  <meta charset="UTF-8">
  <title>Đặt vé - Smart Cinema</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

  <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        background: linear-gradient(rgba(5,10,20,0.96), rgba(5,10,20,0.98)),
                    url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1974') center/cover fixed;
        color:white;
        font-family:'Poppins',sans-serif;
        min-height:100vh;
        overflow-x:hidden;
    }

    /* ==================== NAVBAR & OTHER STYLES (giữ nguyên) ==================== */
    .navbar{ background: rgba(10,10,15,0.9); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,0.06); padding: 14px 0; }
    .navbar-brand{ font-size:1.7rem; font-weight:700; letter-spacing:1px; }
    .nav-link{ color:rgba(255,255,255,0.75)!important; margin:0 10px; font-weight:500; position:relative; transition:0.3s; }
    .nav-link:hover{ color:white!important; }
    .nav-link::after{ content:''; width:0; height:2px; background:#e50914; position:absolute; left:0; bottom:-5px; transition:0.3s; }
    .nav-link:hover::after{ width:100%; }
    .profile-btn{ background: rgba(255,255,255,0.06); border-radius: 50px; padding: 8px 18px; transition: 0.3s; }
    .profile-btn:hover{ background: rgba(255,255,255,0.12); }
    .member-badge{ background: linear-gradient(90deg,#f59e0b,#fbbf24); color:black; padding:3px 10px; border-radius:999px; font-size:0.7rem; font-weight:700; }

    .booking-container{ padding-top:120px; padding-bottom:60px; }
    .glass-card{ background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); backdrop-filter:blur(14px); border-radius:28px; padding:40px; box-shadow:0 10px 40px rgba(0,0,0,0.45); }

    .movie-title{ font-size:2.3rem; font-weight:800; }
    .movie-meta{ color:rgba(255,255,255,0.72); margin-bottom:10px; font-size:1rem; }

    .booking-progress{ display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom:50px; flex-wrap:wrap; }
    .progress-circle{ width:46px; height:46px; border-radius:50%; display:flex; justify-content:center; align-items:center; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.08); font-weight:700; }
    .progress-active .progress-circle{ background:linear-gradient(135deg,#e50914,#ff4d4d); box-shadow:0 10px 25px rgba(229,9,20,0.4); }
    .progress-line{ width:90px; height:3px; background:rgba(255,255,255,0.12); border-radius:999px; }

    .screen{
        width:80%; height:85px; background:linear-gradient(to bottom,#ffffff,#d1d5db); border-radius:100px;
        margin:45px auto 80px; text-align:center; line-height:85px; color:black; font-weight:800;
        letter-spacing:5px; position:relative; box-shadow:0 10px 30px rgba(255,255,255,0.3);
    }

    .legend-box{ width:24px; height:24px; border-radius:8px; }

    .seat-wrapper{ display:flex; flex-direction:column; gap:22px; max-width:1100px; margin:auto; }
    .seat-row{ display:grid; grid-template-columns:70px repeat(10, 1fr); gap:14px; align-items:center; }
    .row-label{ text-align:center; font-size:1.2rem; font-weight:700; color:#facc15; }

    .seat-item{ position:relative; }
    .seat-item input{ display:none; }

    .seat-label{
        width:100%; height:58px; display:flex; justify-content:center; align-items:center;
        border-radius:18px 18px 10px 10px; font-weight:700; font-size:0.95rem;
        cursor:pointer; transition:all 0.25s ease; position:relative; overflow:hidden;
    }

    .seat-label:hover{
        transform: translateY(-6px) scale(1.05);
        box-shadow: 0 15px 30px rgba(255,255,255,0.08);
    }

    /* STANDARD */
    .seat-normal{
        background:rgba(255,255,255,0.08);
        border:1px solid rgba(255,255,255,0.08);
    }

    /* VIP */
    .seat-vip{
        background: linear-gradient(135deg, #facc15, #f59e0b);
        color:black; border:none; box-shadow: 0 10px 20px rgba(250,204,21,0.25);
    }

    /* COUPLE */
    .couple-seat{ grid-column: span 2; }
    .seat-couple{
        background: linear-gradient(135deg, #ec4899, #db2777);
        color:white; border:none; box-shadow: 0 10px 20px rgba(236,72,153,0.35);
    }

    /* SELECTED */
    .seat-item input:checked + .seat-label{
        background: linear-gradient(135deg, #e50914, #ff4d4d);
        color:white; border:none;
        transform: translateY(-6px) scale(1.05);
        box-shadow: 0 15px 35px rgba(229,9,20,0.5);
    }

    /* =========================
       BOOKED - ĐÃ SỬA (Phần quan trọng)
    ========================= */
    .seat-label.seat-booked {
        background: #374151 !important;
        color: rgba(255,255,255,0.45) !important;
        border: 1px solid rgba(255,255,255,0.1) !important;
        cursor: not-allowed !important;
        pointer-events: none;
        position: relative;
        overflow: hidden;
        opacity: 0.75;
    }

    /* Dấu X */
    .seat-label.seat-booked::after {
        content: '✕';
        position: absolute;
        font-size: 1.4rem;
        font-weight: 700;
        color: rgba(255,255,255,0.65);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    /* BOOKED VIP */
    .seat-label.seat-booked.seat-vip {
        background: #7c5d00 !important;
        color: rgba(255,255,255,0.7) !important;
    }

    /* BOOKED COUPLE */
    .seat-label.seat-booked.seat-couple {
        background: #831843 !important;
        color: rgba(255,255,255,0.75) !important;
    }

    /* TOTAL */
    .total-box{
        margin-top:50px;
        background: linear-gradient(135deg, rgba(229,9,20,0.16), rgba(255,255,255,0.04));
        border:1px solid rgba(255,255,255,0.08);
        border-radius:24px;
        padding:30px;
        display:flex;
        justify-content:space-between;
        align-items:center;
        flex-wrap:wrap;
        gap:20px;
    }

    .total-title{ font-size:1.2rem; color:rgba(255,255,255,0.72); }
    .total-price{ font-size:2.4rem; font-weight:800; color:#22c55e; }

    .btn-book{
        background:linear-gradient(90deg,#e50914,#ff4d4d);
        border:none; padding:16px; border-radius:18px; width:100%;
        color:white; font-size:1.1rem; font-weight:700; transition:0.3s; margin-top:30px;
    }

    .btn-book:hover{
        transform:translateY(-4px);
        box-shadow:0 15px 35px rgba(229,9,20,0.45);
    }

    /* RESPONSIVE */
    @media(max-width:992px){
        .seat-row{ grid-template-columns:50px repeat(8, 1fr); }
    }

    @media(max-width:768px){
        .seat-row{ grid-template-columns:45px repeat(6, 1fr); gap:8px; }
        .seat-label{ height:48px; font-size:0.8rem; }
        .screen{ width:100%; }
    }
  </style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">

  <div class="container">

    <a class="navbar-brand" href="/">
      <i class="fas fa-film text-danger me-2"></i>
      BOIZI CINEMA
    </a>

    <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">

      <span class="navbar-toggler-icon"></span>

    </button>

    <div class="collapse navbar-collapse"
         id="navbarNav">

      <ul class="navbar-nav mx-auto">

        <li class="nav-item">
          <a class="nav-link" href="/movies">
            Phim
          </a>
        </li>

        <li class="nav-item">
          <a th:href="@{/booking/history}"
             class="nav-link">

            Lịch sử đặt vé

          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/promotions">
            Khuyến mãi
          </a>
        </li>

      </ul>

      <div class="d-flex align-items-center"
           sec:authorize="isAuthenticated()">

        <div class="dropdown">

          <button class="btn text-white border-0 profile-btn d-flex align-items-center gap-3"
                  type="button"
                  data-bs-toggle="dropdown">

            <i class="fas fa-user-circle fa-2x text-secondary"></i>

            <div class="text-start">

              <div class="fw-medium"
                   th:text="${@userHelper.getFullName(#authentication)}">
              </div>



              <span class="member-badge">
                                MEMBER
                            </span>

            </div>

          </button>

          <ul class="dropdown-menu dropdown-menu-end">

            <li>
              <a class="dropdown-item"
                 th:href="@{/profile}">
                <i class="fas fa-user me-2"></i>
                Thông tin cá nhân
              </a>
            </li>

            <li>
              <a class="dropdown-item"
                 th:href="@{/member-card}">
                <i class="fas fa-id-card me-2"></i>
                Thẻ thành viên
              </a>
            </li>

            <li>
              <hr class="dropdown-divider border-secondary">
            </li>

            <li>

              <form th:action="@{/logout}" method="post">

                <button type="submit"
                        class="dropdown-item text-danger">

                  <i class="fas fa-sign-out-alt me-2"></i>

                  Đăng xuất

                </button>

              </form>

            </li>

          </ul>

        </div>

      </div>

    </div>

  </div>

</nav>

<!-- BOOKING -->

<div class="container booking-container">

  <div class="glass-card">

    <!-- ERROR -->

    <div th:if="${error}"
         class="alert alert-danger">

      <span th:text="${error}"></span>

    </div>

    <!-- PROGRESS -->



    <!-- MOVIE -->

    <div class="row mb-5 align-items-center">

      <div class="col-md-3">

        <img th:src="${showtime.movie.posterUrl}"
             class="img-fluid rounded-4 shadow">

      </div>

      <div class="col-md-9">

        <h1 class="movie-title"
            th:text="${showtime.movie.title}">
        </h1>

        <p class="movie-meta mt-3">

          <i class="fas fa-film me-2"></i>

          <span th:text="${showtime.movie.genre?.name}"></span>

          |

          <i class="fas fa-clock ms-3 me-2"></i>

          <span th:text="${showtime.movie.duration}"></span>

          phút

        </p>

        <p class="movie-meta">

          <i class="fas fa-door-open me-2"></i>

          Phòng:

          <span th:text="${showtime.room.name}"></span>

        </p>

        <p class="movie-meta">

          <i class="fas fa-calendar-alt me-2"></i>

          <span th:text="${#temporals.format(showtime.startTime,'dd/MM/yyyy HH:mm')}"></span>

        </p>

      </div>

    </div>

    <!-- SCREEN -->

    <div class="screen">
      SCREEN
    </div>

    <!-- LEGEND -->

    <div class="d-flex gap-4 justify-content-center mb-5 flex-wrap">

      <div class="d-flex align-items-center gap-2">

        <div class="legend-box bg-secondary"></div>

        <span>Đã đặt</span>

      </div>

      <div class="d-flex align-items-center gap-2">

        <div class="legend-box bg-danger"></div>

        <span>Đang chọn</span>

      </div>

      <div class="d-flex align-items-center gap-2">

        <div class="legend-box"
             style="background: rgba(255,255,255,0.08)">
        </div>

        <span>Ghế thường</span>

      </div>

      <div class="d-flex align-items-center gap-2">

        <div class="legend-box"
             style="background: linear-gradient(135deg,#facc15,#f59e0b)">
        </div>

        <span>Ghế VIP</span>

      </div>

      <div class="d-flex align-items-center gap-2">

        <div class="legend-box"
             style="background: linear-gradient(135deg,#ec4899,#db2777)">
        </div>

        <span>Ghế đôi</span>

      </div>

    </div>

    <!-- FORM -->

    <form th:action="@{/booking/confirm}"
          method="post">

      <input type="hidden"
             name="showtimeId"
             th:value="${showtime.id}">

      <!-- SEAT AREA -->

      <!-- SEAT AREA -->

      <div class="seat-wrapper">

        <!-- ROW A -->
        <div class="seat-row">
          <div class="row-label">A</div>

          <div class="seat-item" th:each="seat : ${seats}" th:if="${#strings.startsWith(seat.seatName, 'A')}">
            <th:block th:if="${seat.status?.name() == 'BOOKED'}">
              <div class="seat-label seat-booked seat-normal" th:text="${seat.seatName}"></div>
            </th:block>


            <th:block th:if="${seat.status?.name() != 'BOOKED'}">
              <input type="checkbox" class="seat-checkbox" name="seatIds"
                     th:value="${seat.id}" th:id="'seat-' + ${seat.id}"
                     th:data-price="80000">
              <label th:for="'seat-' + ${seat.id}" th:text="${seat.seatName}"
                     class="seat-label seat-normal"></label>
            </th:block>
          </div>

        </div>


        <!-- ROW B - tương tự A -->
        <div class="seat-row">
          <div class="row-label">B</div>
          <div class="seat-item" th:each="seat : ${seats}" th:if="${#strings.startsWith(seat.seatName, 'B')}">
            <th:block th:if="${seat.status?.name() == 'BOOKED'}">
              <div class="seat-label seat-booked seat-normal" th:text="${seat.seatName}"></div>
            </th:block>

            <th:block th:if="${seat.status?.name() != 'BOOKED'}">
              <input type="checkbox" class="seat-checkbox" name="seatIds"
                     th:value="${seat.id}" th:id="'seat-' + ${seat.id}"
                     th:data-price="80000">
              <label th:for="'seat-' + ${seat.id}" th:text="${seat.seatName}"
                     class="seat-label seat-normal"></label>
            </th:block>
          </div>
        </div>

        <!-- ROW C (VIP) -->
        <div class="seat-row">
          <div class="row-label">C</div>
          <div class="seat-item" th:each="seat : ${seats}" th:if="${#strings.startsWith(seat.seatName, 'C')}">
            <th:block th:if="${seat.status?.name() == 'BOOKED'}">
              <div class="seat-label seat-booked seat-vip" th:text="${seat.seatName}"></div>
            </th:block>

            <th:block th:if="${seat.status?.name() != 'BOOKED'}">
              <input type="checkbox" class="seat-checkbox" name="seatIds"
                     th:value="${seat.id}" th:id="'seat-' + ${seat.id}"
                     th:data-price="120000">
              <label th:for="'seat-' + ${seat.id}" th:text="${seat.seatName}"
                     class="seat-label seat-vip"></label>
            </th:block>
          </div>
        </div>

        <!-- ROW D (VIP) -->
        <div class="seat-row">
          <div class="row-label">D</div>
          <div class="seat-item" th:each="seat : ${seats}" th:if="${#strings.startsWith(seat.seatName, 'D')}">
            <th:block th:if="${seat.status?.name() == 'BOOKED'}">
              <div class="seat-label seat-booked seat-vip" th:text="${seat.seatName}"></div>
            </th:block>

            <th:block th:if="${seat.status?.name() != 'BOOKED'}">
              <input type="checkbox" class="seat-checkbox" name="seatIds"
                     th:value="${seat.id}" th:id="'seat-' + ${seat.id}"
                     th:data-price="120000">
              <label th:for="'seat-' + ${seat.id}" th:text="${seat.seatName}"
                     class="seat-label seat-vip"></label>
            </th:block>
          </div>
        </div>

        <!-- ROW E (COUPLE) -->
        <div class="seat-row">
          <div class="row-label">E</div>
          <div class="seat-item couple-seat" th:each="seat : ${seats}" th:if="${#strings.startsWith(seat.seatName, 'E')}">
            <th:block th:if="${seat.status?.name() == 'BOOKED'}">
              <div class="seat-label seat-booked seat-couple" th:text="${seat.seatName}"></div>
            </th:block>

            <th:block th:if="${seat.status?.name() != 'BOOKED'}">
              <input type="checkbox" class="seat-checkbox" name="seatIds"
                     th:value="${seat.id}" th:id="'seat-' + ${seat.id}"
                     th:data-price="180000">
              <label th:for="'seat-' + ${seat.id}" th:text="${seat.seatName}"
                     class="seat-label seat-couple"></label>
            </th:block>
          </div>
        </div>

      </div>

      <!-- TOTAL -->

      <div class="total-box">

        <div>

          <div class="total-title">

            <i class="fas fa-ticket-alt me-2 text-danger"></i>

            Tổng thanh toán

          </div>

        </div>

        <div class="total-price"
             id="totalPrice">

          0đ

        </div>

      </div>

      <!-- BUTTON -->

      <button type="submit"
              class="btn-book">

        <i class="fas fa-ticket-alt me-2"></i>

        Xác nhận đặt vé

      </button>

    </form>

  </div>

</div>

<!-- JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

  const seatCheckboxes =
      document.querySelectorAll('.seat-checkbox');

  const totalPrice =
      document.getElementById('totalPrice');

  function updateTotal(){

      let total = 0;

      seatCheckboxes.forEach(seat => {

          if(seat.checked){

              total += parseInt(
                  seat.dataset.price
              );

          }

      });

      totalPrice.innerText =
          total.toLocaleString('vi-VN') + 'đ';

  }

  seatCheckboxes.forEach(seat => {

      seat.addEventListener(
          'change',
          updateTotal
      );

  });

</script>

</body>
</html>

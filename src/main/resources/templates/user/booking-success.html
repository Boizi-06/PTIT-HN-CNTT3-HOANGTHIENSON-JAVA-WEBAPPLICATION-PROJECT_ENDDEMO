<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="vi">

<head>

    <meta charset="UTF-8">

    <title>Đặt vé thành công</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          rel="stylesheet">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            background:
                    linear-gradient(rgba(5,10,20,0.94), rgba(5,10,20,0.98)),
                    url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1974')
                    center/cover fixed;

            font-family:'Poppins',sans-serif;

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            overflow:hidden;

            color:white;

            position:relative;
        }

        /* BACKGROUND EFFECT */

        body::before{

            content:'';

            position:absolute;

            width:500px;
            height:500px;

            background:rgba(239,68,68,0.12);

            border-radius:50%;

            top:-180px;
            right:-150px;

            filter:blur(80px);

        }

        body::after{

            content:'';

            position:absolute;

            width:450px;
            height:450px;

            background:rgba(34,197,94,0.10);

            border-radius:50%;

            bottom:-180px;
            left:-150px;

            filter:blur(80px);

        }

        /* SUCCESS CARD */

        .success-card{

            position:relative;
            z-index:2;

            width:100%;
            max-width:760px;

            background:rgba(255,255,255,0.06);

            border:1px solid rgba(255,255,255,0.08);

            border-radius:36px;

            backdrop-filter:blur(20px);

            padding:60px 55px;

            text-align:center;

            overflow:hidden;

            box-shadow:
                    0 25px 80px rgba(0,0,0,0.45);

            animation:fadeUp 0.8s ease;
        }

        .success-card::before{

            content:'';

            position:absolute;

            width:300px;
            height:300px;

            background:rgba(255,255,255,0.04);

            border-radius:50%;

            top:-120px;
            right:-100px;
        }

        .success-card::after{

            content:'';

            position:absolute;

            width:220px;
            height:220px;

            background:rgba(255,255,255,0.03);

            border-radius:50%;

            bottom:-100px;
            left:-80px;
        }

        /* SUCCESS ICON */

        .success-icon{

            width:140px;
            height:140px;

            margin:auto;

            border-radius:50%;

            background:
                    linear-gradient(
                            135deg,
                            #16a34a,
                            #22c55e
                    );

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:4.5rem;

            margin-bottom:35px;

            box-shadow:
                    0 20px 50px rgba(34,197,94,0.4);

            position:relative;

            z-index:2;

            animation:pulse 2s infinite;
        }

        .success-icon::before{

            content:'';

            position:absolute;

            inset:-12px;

            border-radius:50%;

            border:2px solid rgba(255,255,255,0.15);
        }

        /* TITLE */

        .success-title{

            font-size:3rem;
            font-weight:800;

            margin-bottom:20px;

            position:relative;
            z-index:2;
        }

        /* TEXT */

        .success-text{

            color:rgba(255,255,255,0.78);

            font-size:1.08rem;

            line-height:1.9;

            max-width:540px;

            margin:auto;

            position:relative;
            z-index:2;
        }

        /* BOOKING CODE */

        .booking-wrapper{

            margin-top:40px;

            position:relative;
            z-index:2;
        }

        .booking-label{

            color:rgba(255,255,255,0.6);

            margin-bottom:12px;

            letter-spacing:2px;

            font-size:0.9rem;
        }

        .booking-code{

            display:inline-flex;
            align-items:center;
            gap:12px;

            background:rgba(255,255,255,0.08);

            border:1px solid rgba(255,255,255,0.08);

            padding:18px 30px;

            border-radius:20px;

            font-size:1.5rem;
            font-weight:700;

            letter-spacing:3px;

            color:#fff;

            box-shadow:
                    inset 0 0 20px rgba(255,255,255,0.02);
        }

        .booking-code i{
            color:#22c55e;
        }

        /* BUTTON GROUP */

        .button-group{

            margin-top:45px;

            display:flex;
            justify-content:center;
            gap:18px;

            flex-wrap:wrap;

            position:relative;
            z-index:2;
        }

        /* BUTTON */

        .btn-home{

            background:
                    linear-gradient(
                            135deg,
                            #ef4444,
                            #dc2626
                    );

            border:none;

            padding:15px 34px;

            border-radius:18px;

            color:white;

            font-weight:600;

            transition:0.35s;

            box-shadow:
                    0 15px 35px rgba(239,68,68,0.35);
        }

        .btn-home:hover{

            transform:translateY(-4px);

            box-shadow:
                    0 20px 45px rgba(239,68,68,0.45);

            color:white;
        }

        /* SECOND BUTTON */

        .btn-history{

            background:rgba(255,255,255,0.08);

            border:1px solid rgba(255,255,255,0.08);

            padding:15px 34px;

            border-radius:18px;

            color:white;

            font-weight:600;

            transition:0.35s;
        }

        .btn-history:hover{

            background:rgba(255,255,255,0.12);

            transform:translateY(-4px);

            color:white;
        }

        /* DECORATION */

        .ticket-decoration{

            position:absolute;

            top:50%;

            left:-25px;

            width:50px;
            height:50px;

            background:#050a14;

            border-radius:50%;

            transform:translateY(-50%);
        }

        .ticket-decoration-right{

            position:absolute;

            top:50%;

            right:-25px;

            width:50px;
            height:50px;

            background:#050a14;

            border-radius:50%;

            transform:translateY(-50%);
        }

        /* ANIMATION */

        @keyframes fadeUp{

            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        @keyframes pulse{

            0%{
                transform:scale(1);
            }

            50%{
                transform:scale(1.04);
            }

            100%{
                transform:scale(1);
            }

        }

        /* MOBILE */

        @media(max-width:768px){

            .success-card{
                margin:20px;
                padding:45px 28px;
            }

            .success-title{
                font-size:2.2rem;
            }

            .success-icon{
                width:110px;
                height:110px;
                font-size:3.5rem;
            }

            .booking-code{
                font-size:1.1rem;
                padding:15px 20px;
            }

            .button-group{
                flex-direction:column;
            }

            .btn-home,
            .btn-history{
                width:100%;
            }

        }
        .poster-bg{
  position: fixed;
  inset: 0;
  z-index: -2;
  background-size: cover;
  background-position: center;
  filter: blur(14px) brightness(0.55) saturate(1.3);
  transform: scale(1.1);
}

.poster-overlay{
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(circle at top, rgba(34,197,94,0.15), transparent 40%),
    radial-gradient(circle at bottom, rgba(239,68,68,0.12), transparent 45%),
    rgba(2,6,23,0.65);
}
        .success-card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:760px;

  background: rgba(15, 23, 42, 0.55);
  border: 1px solid rgba(255,255,255,0.12);

  border-radius: 36px;
  backdrop-filter: blur(25px);

  padding: 60px 55px;
  text-align:center;

  box-shadow: 0 30px 90px rgba(0,0,0,0.6);

  animation: fadeUp 0.8s ease;
}
        .success-icon{
  width:150px;
  height:150px;
  margin:auto;

  border-radius:50%;

  background: linear-gradient(135deg,#22c55e,#16a34a);

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:4.8rem;

  box-shadow: 0 25px 70px rgba(34,197,94,0.45);

  animation: pulse 1.8s infinite;
}
        .success-title{
  font-size:3.2rem;
  font-weight:900;

  background: linear-gradient(90deg,#fff,#22c55e,#fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
        .booking-code{
  display:inline-flex;
  align-items:center;
  gap:12px;

  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);

  padding: 18px 32px;
  border-radius: 18px;

  font-size: 1.6rem;
  font-weight: 800;

  letter-spacing: 4px;

  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

    </style>

</head>

<body>

<div class="poster-bg"
     th:style="'background-image:url(https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1974)'">
</div>

<div class="poster-overlay"></div>

<div class="success-card">

    <!-- DECOR -->

    <div class="ticket-decoration"></div>
    <div class="ticket-decoration-right"></div>

    <!-- ICON -->

    <div class="success-icon">

        <i class="fas fa-check"></i>

    </div>

    <!-- TITLE -->

    <h1 class="success-title">

        Đặt vé thành công

    </h1>

    <!-- TEXT -->

    <p class="success-text">

        Vé của bạn đã được xác nhận thành công.
        Chúc bạn có trải nghiệm xem phim tuyệt vời tại
        <strong>BOIZI CINEMA</strong>.

    </p>

    <!-- BOOKING CODE -->

    <div class="booking-wrapper">

        <div class="booking-label">

            MÃ ĐẶT VÉ

        </div>

        <div class="booking-code">

            <i class="fas fa-ticket-alt"></i>

            #<span th:text="${bookingId}"></span>

        </div>

    </div>

    <!-- BUTTON -->

    <div class="button-group">

        <a href="/"
           class="btn btn-home">

            <i class="fas fa-home me-2"></i>

            Trang chủ

        </a>

        <a href="/booking/history"
           class="btn btn-history">

            <i class="fas fa-clock-rotate-left me-2"></i>

            Lịch sử đặt vé

        </a>

    </div>

</div>

</body>

</html>

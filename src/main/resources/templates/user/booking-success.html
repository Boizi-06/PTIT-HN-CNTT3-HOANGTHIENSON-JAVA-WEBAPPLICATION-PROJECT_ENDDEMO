<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="vi">

<head>

    <meta charset="UTF-8">

    <title>Đặt vé thành công</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          rel="stylesheet">

    <style>

        body{
            background:
                    linear-gradient(rgba(5,10,20,0.96), rgba(5,10,20,0.98)),
                    url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1974')
                    center/cover fixed;

            color: white;
            font-family: 'Poppins', sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .success-card{

            width: 100%;
            max-width: 700px;

            background: rgba(255,255,255,0.05);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 30px;

            backdrop-filter: blur(14px);

            padding: 50px;

            text-align: center;

            box-shadow: 0 15px 40px rgba(0,0,0,0.45);
        }

        .success-icon{

            width: 120px;
            height: 120px;

            margin: auto;

            border-radius: 50%;

            background: linear-gradient(135deg,#16a34a,#22c55e);

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 4rem;

            margin-bottom: 30px;

            box-shadow: 0 15px 35px rgba(34,197,94,0.4);
        }

        .success-title{
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .success-text{
            color: rgba(255,255,255,0.75);
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .booking-code{
            margin-top: 25px;

            background: rgba(255,255,255,0.08);

            padding: 18px;

            border-radius: 18px;

            font-size: 1.3rem;
            font-weight: 700;

            letter-spacing: 2px;
        }

        .btn-home{

            margin-top: 35px;

            background: linear-gradient(90deg,#e50914,#ff4d4d);

            border: none;

            padding: 14px 32px;

            border-radius: 16px;

            color: white;

            font-weight: 600;

            transition: 0.3s;
        }

        .btn-home:hover{
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(229,9,20,0.35);
        }

    </style>

</head>

<body>

<div class="success-card">

    <div class="success-icon">

        <i class="fas fa-check"></i>

    </div>

    <h1 class="success-title">

        Đặt vé thành công

    </h1>

    <p class="success-text">

        Vé của bạn đã được xác nhận thành công.
        Chúc bạn có trải nghiệm xem phim tuyệt vời tại Smart Cinema.

    </p>

    <div class="booking-code">

        MÃ ĐẶT VÉ:
        #<span th:text="${bookingId}"></span>

    </div>

    <a href="/"
       class="btn btn-home">

        <i class="fas fa-home me-2"></i>

        Quay về trang chủ

    </a>

</div>

</body>
</html>

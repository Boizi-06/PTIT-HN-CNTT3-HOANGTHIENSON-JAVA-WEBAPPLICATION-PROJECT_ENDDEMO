<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Lịch sử đặt vé</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>

    body{
        background:#f4f6f9;
        font-family:'Segoe UI', sans-serif;
    }

    .history-card{
        background:white;
        border-radius:20px;
        padding:24px;
        margin-bottom:24px;
        box-shadow:0 4px 18px rgba(0,0,0,0.08);
        transition:0.3s;
    }

    .history-card:hover{
        transform:translateY(-3px);
    }

    .poster-img{
        width:100%;
        height:320px;
        object-fit:cover;
        border-radius:16px;
    }

    .movie-title{
        font-size:28px;
        font-weight:700;
        margin-bottom:10px;
    }

    .price{
        color:#dc3545;
        font-size:24px;
        font-weight:bold;
    }

    .info-label{
        font-weight:600;
        color:#555;
    }

    .cancel-expired{
        color:#6c757d;
        font-weight:600;
    }

    .cancelled-text{
        color:#dc3545;
        font-weight:700;
    }

    .top-title{
        font-size:36px;
        font-weight:800;
    }

  </style>
</head>
<body>

<div class="container py-5">

  <!-- TITLE -->

  <div class="d-flex justify-content-between align-items-center mb-4">

    <h2 class="top-title">
      🎟 Lịch sử đặt vé
    </h2>

    <a href="/home"
       class="btn btn-dark">

      <i class="bi bi-house"></i>
      Trang chủ

    </a>

  </div>

  <!-- SUCCESS -->

  <div th:if="${success}"
       class="alert alert-success alert-dismissible fade show">

    <span th:text="${success}"></span>

    <button type="button"
            class="btn-close"
            data-bs-dismiss="alert">
    </button>

  </div>

  <!-- ERROR -->

  <div th:if="${error}"
       class="alert alert-danger alert-dismissible fade show">

    <span th:text="${error}"></span>

    <button type="button"
            class="btn-close"
            data-bs-dismiss="alert">
    </button>

  </div>

  <!-- EMPTY -->

  <div th:if="${#lists.isEmpty(bookings)}"
       class="alert alert-info shadow-sm">

    Bạn chưa đặt vé nào.

  </div>

  <!-- LIST -->

  <div th:each="booking : ${bookings}"
       class="history-card">

    <div class="row g-4">

      <!-- POSTER -->

      <div class="col-md-3">

        <img th:src="${booking.showtime.movie.posterUrl}"
             class="poster-img">

      </div>

      <!-- INFO -->

      <div class="col-md-9">

        <div class="movie-title"
             th:text="${booking.showtime.movie.title}">
        </div>

        <hr>

        <!-- ROOM -->

        <p>
                    <span class="info-label">
                        <i class="bi bi-door-open"></i>
                        Phòng:
                    </span>

          <span th:text="${booking.showtime.room.name}">
                    </span>
        </p>

        <!-- SHOWTIME -->

        <p>

                    <span class="info-label">

                        <i class="bi bi-calendar-event"></i>
                        Suất chiếu:

                    </span>

          <span th:text="${#temporals.format(
                        booking.showtime.startTime,
                        'dd/MM/yyyy HH:mm'
                    )}">
                    </span>

        </p>

        <!-- BOOKING TIME -->

        <p>

                    <span class="info-label">

                        <i class="bi bi-clock-history"></i>
                        Ngày đặt:

                    </span>

          <span th:text="${#temporals.format(
                        booking.bookingTime,
                        'dd/MM/yyyy HH:mm'
                    )}">
                    </span>

        </p>

        <!-- SEATS -->

        <p>

                    <span class="info-label">

                        <i class="bi bi-grid-3x3-gap"></i>
                        Ghế:

                    </span>

          <span th:each="ticket, stat : ${booking.tickets}">

                        <span class="badge bg-dark"
                              th:text="${ticket.seat.seatName}">
                        </span>

                        <span th:if="${!stat.last}">
                            &nbsp;
                        </span>

                    </span>

        </p>

        <!-- STATUS -->

        <p>

                    <span class="info-label">

                        <i class="bi bi-info-circle"></i>
                        Trạng thái:

                    </span>

          <!-- CONFIRMED -->

          <span th:if="${booking.status.name() == 'CONFIRMED'}"
                class="badge bg-success">

                        Đã xác nhận

                    </span>

          <!-- CANCELLED -->

          <span th:if="${booking.status.name() == 'CANCELLED'}"
                class="badge bg-danger">

                        Đã hủy

                    </span>

          <!-- PENDING -->

          <span th:if="${booking.status.name() == 'PENDING'}"
                class="badge bg-warning text-dark">

                        Đang xử lý

                    </span>

        </p>

        <!-- TOTAL -->

        <div class="price mb-3"
             th:text="${#numbers.formatDecimal(
                        booking.totalAmount,
                        0,
                        'COMMA',
                        0,
                        'POINT'
                     ) + ' VNĐ'}">

        </div>

        <!-- ACTION -->

        <div class="mt-3">

          <!-- ĐƯỢC HỦY -->

          <form th:if="${booking.status.name() != 'CANCELLED'
                              && T(java.time.LocalDateTime).now()
                              .isBefore(booking.bookingTime.plusDays(1))}"

                th:action="@{'/booking/cancel/' + ${booking.id}}"
                method="post">

            <button type="submit"
                    class="btn btn-danger">

              <i class="bi bi-x-circle"></i>
              Hủy vé

            </button>

          </form>

          <!-- HẾT THỜI GIAN -->

          <div th:if="${booking.status.name() != 'CANCELLED'
                            && T(java.time.LocalDateTime).now()
                            .isAfter(booking.bookingTime.plusDays(1))}"

               class="cancel-expired">

            ⏰ Đã hết thời gian hủy vé

          </div>

          <!-- ĐÃ HỦY -->

          <div th:if="${booking.status.name() == 'CANCELLED'}"
               class="cancelled-text">

            ❌ Vé đã bị hủy

          </div>

        </div>

      </div>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Lịch sử đặt vé</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background: linear-gradient(rgba(5,10,20,0.96), rgba(5,10,20,0.98)),
                        url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1974') center/cover fixed;
            color:white;
            font-family:'Poppins',sans-serif;
            min-height:100vh;
            overflow-x:hidden;
        }
        .navbar{background:rgba(10,10,15,0.88); backdrop-filter:blur(14px); border-bottom:1px solid rgba(255,255,255,0.05); padding:14px 0; z-index:9999;}
        .navbar-brand{font-size:1.7rem; font-weight:700; color:white !important;}
        .nav-link{color:rgba(255,255,255,0.75)!important; margin:0 10px; position:relative;}
        .nav-link:hover{color:white!important;}
        .nav-link::after{content:''; position:absolute; left:0; bottom:-5px; width:0; height:2px; background:#ef4444; transition:0.3s;}
        .nav-link:hover::after{width:100%;}
        .profile-btn{background:rgba(255,255,255,0.06); border-radius:50px; padding:8px 18px;}
        .profile-btn:hover{background:rgba(255,255,255,0.12);}
        .member-badge{background:linear-gradient(90deg,#f59e0b,#fbbf24); color:black; padding:3px 10px; border-radius:999px; font-size:0.7rem; font-weight:700;}
        .history-card{background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:28px; padding:24px; margin-bottom:28px; backdrop-filter:blur(18px); transition:0.35s;}
        .history-card:hover{transform:translateY(-6px); box-shadow:0 20px 50px rgba(0,0,0,0.4);}
        .poster-img{width:100%; height:330px; object-fit:cover; border-radius:20px;}
        .movie-title{font-size:2rem; font-weight:700; margin-bottom:16px;}
        .price{font-size:2.2rem; font-weight:800; background:linear-gradient(135deg,#ff4d4d,#ffd54a); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}
        .btn-danger{border:none!important; border-radius:14px; padding:12px 22px; font-weight:600; background:linear-gradient(135deg,#ef4444,#dc2626)!important;}
        .btn-danger:hover{transform:translateY(-3px);}
        @media(max-width:768px){
            .movie-title{font-size:1.5rem;}
            .poster-img{height:260px;}
            .history-card{padding:25px;}
            .price{font-size:1.8rem;}
        }
        .aa {
        margin-top:58px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-film text-danger me-2"></i>BOIZI CINEMA</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link" href="/movies">Phim</a></li>
                <li class="nav-item"><a th:href="@{/booking/history}" class="nav-link">Lịch sử đặt vé</a></li>
                <li class="nav-item"><a class="nav-link" href="/promotions">Khuyến mãi</a></li>
            </ul>

            <div class="d-flex align-items-center" sec:authorize="isAuthenticated()">
                <div class="dropdown">
                    <button class="btn text-white border-0 profile-btn d-flex align-items-center gap-3" type="button" data-bs-toggle="dropdown">
                        <i class="fas fa-user-circle fa-2x text-secondary"></i>
                        <div class="text-start">
                            <div class="fw-medium" th:text="${@userHelper.getFullName(#authentication)}"></div>
                            <span class="member-badge">MEMBER</span>
                        </div>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/profile}"><i class="fas fa-user me-2"></i>Thông tin cá nhân</a></li>
                        <li><a class="dropdown-item" th:href="@{/member-card}"><i class="fas fa-id-card me-2"></i>Thẻ thành viên</a></li>
                        <li><hr class="dropdown-divider border-secondary"></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item text-danger"><i class="fas fa-sign-out-alt me-2"></i>Đăng xuất</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- MAIN -->
<div class="container main-container py-5">
    <div class="aa"></div>
    <div class="d-flex justify-content-between align-items-center mb-4 aa"></div>

    <!-- EMPTY -->
    <div th:if="${#lists.isEmpty(bookings)}" class="alert alert-info shadow-sm">
        Bạn chưa đặt vé nào.
    </div>

    <!-- LIST -->
    <div th:each="booking : ${bookings}" class="history-card">
        <div class="row g-4">
            <div class="col-lg-3 col-md-4">
                <img th:src="${booking.showtime.movie.posterUrl}" class="poster-img" loading="lazy">
            </div>

            <div class="col-lg-9 col-md-8">
                <div class="movie-title" th:text="${booking.showtime.movie.title}"></div>
                <hr>
                <p><span class="info-label"><i class="bi bi-door-open"></i>Phòng:</span> <span th:text="${booking.showtime.room.name}"></span></p>
                <p><span class="info-label"><i class="bi bi-calendar-event"></i>Suất chiếu:</span> <span th:text="${#temporals.format(booking.showtime.startTime, 'dd/MM/yyyy HH:mm')}"></span></p>
                <p><span class="info-label"><i class="bi bi-clock-history"></i>Ngày đặt:</span> <span th:text="${#temporals.format(booking.bookingTime, 'dd/MM/yyyy HH:mm')}"></span></p>

                <p>
                    <span class="info-label"><i class="bi bi-grid-3x3-gap"></i>Ghế:</span>
                    <span th:each="ticket, stat : ${booking.tickets}">
                        <span class="badge bg-dark" th:text="${ticket.seat.seatName}"></span>
                        <span th:if="${!stat.last}">&nbsp;</span>
                    </span>
                </p>

                <p>
                    <span class="info-label"><i class="bi bi-info-circle"></i>Trạng thái:</span>
                    <span th:if="${booking.status.name() == 'CONFIRMED'}" class="badge bg-success">Đã xác nhận</span>
                    <span th:if="${booking.status.name() == 'CANCELLED'}" class="badge bg-danger">Đã hủy</span>
                    <span th:if="${booking.status.name() == 'PENDING'}" class="badge bg-warning text-dark">Đang xử lý</span>
                </p>

                <div class="price mb-3" th:text="${#numbers.formatDecimal(booking.totalAmount, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}"></div>

                <!-- HỦY VÉ - CỰC KỲ ĐƠN GIẢN (chỉ dùng confirm) -->
                <div th:if="${booking.status.name() != 'CANCELLED' && T(java.time.LocalDateTime).now().isBefore(booking.bookingTime.plusDays(1))}">
                    <form th:action="@{/booking/cancel/{id}(id=${booking.id})}"
                          method="post"
                          onsubmit="return confirm('Bạn có chắc chắn muốn hủy vé này?\n\nPhim: ' + '${booking.showtime.movie.title}' + '\n\nHành động này không thể hoàn tác!');">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-x-circle"></i> Hủy vé
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Xác nhận vé - BOIZI CINEMA</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    :root{
      --bg:#020817;
      --bg2:#0f172a;
      --primary:#ef4444;
      --primary2:#dc2626;
      --text:#fff;
      --muted:rgba(255,255,255,0.7);
      --glass:rgba(255,255,255,0.08);
      --border:rgba(255,255,255,0.12);
    }

    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      font-family:'Poppins',sans-serif;
      background:linear-gradient(135deg,#020617,#071126,#0f172a);
      color:white;
      min-height:100vh;
    }

    body::before{
      content:'';
      position:fixed;
      inset:0;
      background:
        radial-gradient(circle at top left, rgba(239,68,68,0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(59,130,246,0.12), transparent 40%);
      z-index:-1;
    }

    /* NAVBAR */
    .navbar{
      height:90px;
      background:rgba(2,6,23,0.75);
      backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(255,255,255,0.06);
    }

    .navbar-brand{
      font-weight:800;
      font-size:1.6rem;
    }

    .nav-link{
      color:rgba(255,255,255,0.75)!important;
      border-radius:12px;
      padding:10px 16px!important;
    }

    .nav-link:hover{
      background:rgba(255,255,255,0.08);
      color:#fff!important;
    }

    /* PAGE */
    .page{
      padding-top:140px;
      padding-bottom:60px;
    }

    /* GLASS CARD */
    .glass{
      background:var(--glass);
      border:1px solid var(--border);
      backdrop-filter:blur(20px);
      border-radius:28px;
      padding:40px;
      box-shadow:0 20px 60px rgba(0,0,0,0.35);
    }

    .title{
      font-size:2.2rem;
      font-weight:800;
      margin-bottom:30px;
      text-align:center;
    }

    .title::after{
      content:'';
      display:block;
      width:80px;
      height:4px;
      background:var(--primary);
      margin:15px auto 0;
      border-radius:999px;
    }

    /* INFO */
    .info-box{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      padding:20px;
      border-radius:18px;
      margin-bottom:20px;
    }

    .label{
      color:var(--muted);
      font-size:0.9rem;
    }

    .value{
      font-size:1.2rem;
      font-weight:600;
    }

    /* SEATS */
    .seat-wrap{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      padding:20px;
      background:rgba(255,255,255,0.03);
      border-radius:18px;
      border:1px solid rgba(255,255,255,0.08);
      margin:20px 0;
    }

    .seat{
      padding:10px 16px;
      border-radius:999px;
      background:linear-gradient(135deg,#ef4444,#dc2626);
      font-weight:700;
    }

    /* PRICE */
    .price{
      text-align:center;
      padding:25px;
      border-radius:20px;
      background:linear-gradient(135deg,#10b981,#059669);
      margin:25px 0;
      font-size:2rem;
      font-weight:900;
    }

    /* BUTTONS */
    .btn-pay{
      width:100%;
      padding:14px;
      border-radius:14px;
      background:linear-gradient(135deg,var(--primary),var(--primary2));
      border:none;
      font-weight:700;
    }

    .btn-cancel{
      width:100%;
      margin-top:12px;
      padding:14px;
      border-radius:14px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.15);
      color:white;
    }
    /* BACKGROUND POSTER */
.poster-bg {
  position: fixed;
  inset: 0;
  z-index: -2;
  background-size: cover;
  background-position: center;
  filter: blur(18px) brightness(0.35);
  transform: scale(1.1);
}

/* LỚP overlay tối */
.poster-overlay {
  position: fixed;
  inset: 0;
  z-index: -1;
  background: radial-gradient(circle at top, rgba(0,0,0,0.3), rgba(0,0,0,0.9));
}
    .glass{
  background: rgba(15, 23, 42, 0.65);
  border: 1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(22px);
  border-radius: 30px;
  padding: 45px;
  box-shadow: 0 25px 80px rgba(0,0,0,0.6);
  max-width: 900px;
  margin: auto;
}
    .title{
  font-size: 2.6rem;
  font-weight: 900;
  text-align: center;
  background: linear-gradient(90deg,#fff,#f43f5e,#fff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
    .info-box{
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 18px 22px;
  border-radius: 16px;
  transition: 0.3s;
}

.info-box:hover{
  transform: translateY(-3px);
  background: rgba(255,255,255,0.08);
}
    .price{
  text-align:center;
  padding:30px;
  border-radius:20px;
  background: linear-gradient(135deg,#16a34a,#22c55e);
  font-size:2.4rem;
  font-weight:900;
  box-shadow: 0 15px 40px rgba(34,197,94,0.3);
}
    .btn-pay{
  width:100%;
  padding:16px;
  border-radius:16px;
  background: linear-gradient(135deg,#ef4444,#f97316);
  border:none;
  font-weight:800;
  letter-spacing:1px;
  transition:0.3s;
}

.btn-pay:hover{
  transform: translateY(-3px);
  box-shadow: 0 15px 40px rgba(239,68,68,0.4);
}

  </style>
</head>

<body>
<div class="poster-bg"
     th:style="'background-image:url(' + ${showtime.movie.posterUrl} + ')'">
</div>

<div class="poster-overlay"></div>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand text-white" href="/">
      <i class="fas fa-film text-danger me-2"></i> BOIZI CINEMA
    </a>
  </div>
</nav>

<!-- PAGE -->
<div class="container page">

  <div class="glass">

    <h1 class="title">
      <i class="fas fa-ticket-alt text-danger me-2"></i>
      Xác nhận đặt vé
    </h1>

    <!-- INFO -->
    <div class="info-box">
      <div class="label">Phim</div>
      <div class="value" th:text="${showtime.movie.title}"></div>
    </div>

    <div class="info-box">
      <div class="label">Phòng</div>
      <div class="value" th:text="${showtime.room.name}"></div>
    </div>

    <div class="info-box">
      <div class="label">Suất chiếu</div>
      <div class="value"
           th:text="${#temporals.format(showtime.startTime,'dd/MM/yyyy HH:mm')}"></div>
    </div>

    <!-- SEATS -->
    <h5 class="text-center mt-4 mb-3">
      Ghế đã chọn
    </h5>

    <div class="seat-wrap">
      <span class="seat"
            th:each="seat : ${selectedSeats}"
            th:text="${seat.seatName}">
      </span>
    </div>

    <!-- PRICE -->
    <div class="price">
      <span th:text="${#numbers.formatDecimal(totalPrice,0,'COMMA',0,'POINT')}"></span> đ
    </div>

    <!-- FORM -->
    <form id="paymentForm" th:action="@{/booking/payment}" method="post">

      <input type="hidden" name="showtimeId" th:value="${showtime.id}">
      <input type="hidden" th:each="seatId : ${seatIds}" name="seatIds" th:value="${seatId}">

      <button type="submit" class="btn btn-pay">
        THANH TOÁN
      </button>

      <button type="button"
              class="btn btn-cancel"
              data-bs-toggle="modal"
              data-bs-target="#cancelModal">
        HỦY VÉ
      </button>

    </form>

  </div>
</div>



<!-- MODAL CANCEL -->
<div class="modal fade" id="cancelModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-white rounded-4">
      <div class="modal-body text-center p-4">
        <i class="fas fa-times-circle text-warning fa-3x"></i>
        <h4 class="mt-3">Bạn chắc chắn muốn hủy?</h4>
        <a th:href="@{/movies/{id}(id=${showtime.movie.id})}"
           class="btn btn-warning mt-3">
          Xác nhận hủy
        </a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>



</body>
</html>

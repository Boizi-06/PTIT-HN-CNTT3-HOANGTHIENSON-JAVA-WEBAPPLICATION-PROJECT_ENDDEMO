<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Xác nhận vé - BOIZI CINEMA</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    /* ===== BASE ===== */
    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      font-family:'Poppins',sans-serif;
      min-height:100vh;
      overflow-x:hidden;
      color:white;
    }

    /* ===== BACKGROUND POSTER (FIX 100%) ===== */
    .poster-bg{
      position:fixed;
      inset:0;
      z-index:-3;
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;

      /* 🔥 FIX quan trọng: tránh posterUrl null làm mất background */
      background-image:url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=2000');

      filter: blur(20px) brightness(0.65) saturate(1.2);
      transform:scale(1.1);
      animation: zoomBg 14s ease-in-out infinite alternate;
    }

    /* override nếu có poster */
    .poster-bg[data-poster]{
      background-image: var(--poster);
    }

    .poster-overlay{
      position:fixed;
      inset:0;
      z-index:-2;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.10), transparent 45%),
        linear-gradient(135deg, rgba(2,6,23,0.55), rgba(15,23,42,0.95));
    }

    /* ===== NAV ===== */
    .navbar{
      background:rgba(10,15,30,0.55);
      backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(255,255,255,0.08);
    }

    /* ===== PAGE ===== */
    .page{
      padding-top:140px;
      padding-bottom:60px;
    }

    /* ===== GLASS CARD ===== */
    .glass{
      background:rgba(255,255,255,0.10);
      border:1px solid rgba(255,255,255,0.18);
      backdrop-filter:blur(26px);
      border-radius:36px;
      padding:50px;
      box-shadow:0 30px 90px rgba(0,0,0,0.65);
      animation: fadeUp 0.8s ease;
    }

    /* TITLE */
    .title{
      font-size:2.8rem;
      font-weight:900;
      text-align:center;
      background: linear-gradient(90deg,#fff,#ff4d6d,#fff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      animation: glowText 2.5s infinite alternate;
    }

    /* INFO BOX */
    .info-box{
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.1);
      padding:18px 22px;
      border-radius:18px;
      margin-bottom:14px;
      transition:0.3s;
    }

    .info-box:hover{
      transform:translateY(-4px);
      background:rgba(255,255,255,0.12);
    }

    /* SEATS */
    .seat-wrap{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      padding:20px;
      border-radius:18px;
      background:rgba(255,255,255,0.04);
    }

    .seat{
      padding:10px 18px;
      border-radius:999px;
      font-weight:800;
      background:linear-gradient(135deg,#ff4d6d,#ff7a18);
      box-shadow:0 10px 25px rgba(255,77,109,0.3);
      animation: pop 0.4s ease;
    }

    /* PRICE */
    .price{
      text-align:center;
      padding:30px;
      border-radius:24px;
      font-size:2.7rem;
      font-weight:900;
      background:linear-gradient(135deg,#22c55e,#16a34a);
      box-shadow:0 25px 60px rgba(34,197,94,0.35);
      animation: glowBox 2s infinite alternate;
    }

    /* BUTTON */
    .btn-pay{
      width:100%;
      padding:16px;
      border-radius:16px;
      font-weight:900;
      letter-spacing:1px;
      background:linear-gradient(135deg,#ff3d6e,#ff7a18);
      border:none;
      transition:0.3s;
    }

    .btn-pay:hover{
      transform:translateY(-4px);
      box-shadow:0 20px 50px rgba(255,61,110,0.4);
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(40px);}
      to{opacity:1;transform:translateY(0);}
    }

    @keyframes glowText{
      from{text-shadow:0 0 10px rgba(255,77,109,0.2);}
      to{text-shadow:0 0 25px rgba(255,77,109,0.5);}
    }

    @keyframes glowBox{
      from{box-shadow:0 20px 40px rgba(34,197,94,0.2);}
      to{box-shadow:0 25px 70px rgba(34,197,94,0.5);}
    }

    @keyframes pop{
      from{transform:scale(0.85);opacity:0;}
      to{transform:scale(1);opacity:1;}
    }

    @keyframes zoomBg{
      from{transform:scale(1.1);}
      to{transform:scale(1.18);}
    }

  </style>
</head>

<body>

<!-- ===== BACKGROUND FIX THYMELEAF ===== -->
<div class="poster-bg"
     th:style="${showtime.movie.posterUrl != null}
        ? 'background-image:url(' + ${showtime.movie.posterUrl} + ')'
        : ''">
</div>

<div class="poster-overlay"></div>

<!-- NAV -->
<nav class="navbar navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand fw-bold text-white">
      <i class="fas fa-film text-danger me-2"></i>
      BOIZI CINEMA
    </a>
  </div>
</nav>

<!-- CONTENT -->
<div class="container page">

  <div class="glass">

    <h1 class="title">
      <i class="fas fa-ticket-alt me-2"></i>
      Xác nhận đặt vé
    </h1>

    <div class="info-box">
      <div class="text-muted">Phim</div>
      <div class="fw-bold" th:text="${showtime.movie.title}"></div>
    </div>

    <div class="info-box">
      <div class="text-muted">Phòng</div>
      <div class="fw-bold" th:text="${showtime.room.name}"></div>
    </div>

    <div class="info-box">
      <div class="text-muted">Suất chiếu</div>
      <div class="fw-bold"
           th:text="${#temporals.format(showtime.startTime,'dd/MM/yyyy HH:mm')}"></div>
    </div>

    <h5 class="text-center mt-4 mb-3 text-warning">
      Ghế đã chọn
    </h5>

    <div class="seat-wrap">
      <span class="seat"
            th:each="seat : ${selectedSeats}"
            th:text="${seat.seatName}">
      </span>
    </div>

    <div class="price mt-4 mb-4">
      <span th:text="${#numbers.formatDecimal(totalPrice,0,'COMMA',0,'POINT')}"></span> đ
    </div>

    <form th:action="@{/booking/payment}" method="post">

      <input type="hidden" name="showtimeId" th:value="${showtime.id}">
      <input type="hidden" th:each="seatId : ${seatIds}" name="seatIds" th:value="${seatId}">

      <button class="btn btn-pay">
        THANH TOÁN NGAY
      </button>

    </form>

  </div>
</div>

</body>
</html>
